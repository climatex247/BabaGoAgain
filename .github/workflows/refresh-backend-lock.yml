name: Refresh backend dependency lockfile

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-backend-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate lockfile from package.json
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Backend lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "Refresh backend dependency lockfile"
          git push
