name: Baba Go Again wallet security checks

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/wallet-security.yml'
  push:
    branches:
      - fix/wallet-credit-no-campaign-cap
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/wallet-security.yml'

permissions:
  contents: read

jobs:
  wallet-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Run syntax and smoke checks
        working-directory: backend
        run: npm run preflight
