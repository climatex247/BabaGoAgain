<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0D47A1">
  <meta name="description" content="Recover your Baba Go Again account.">
  <title>Forgot Password | Baba Go Again</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/forgot-password.js" defer></script>
  <link rel="stylesheet" href="/bga-features.css?v=20261016-features1">
</head>
<body class="bga-page">
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-icon">B</span>
      <span>Baba Go Again</span>
    </a>
    <a class="login-link" href="/login">Log In</a>
  </header>

  <main class="hero">
    <section class="hero-content">
      <span class="eyebrow">ACCOUNT RECOVERY</span>
      <h1>Forgot your password?</h1>

      <p>
        Enter the email address associated with your account.
        If your account is eligible for recovery, you will receive
        instructions by email.
      </p>

      <form id="forgotPasswordForm">
        <label for="email">Registered email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          maxlength="254"
          required
        >

        <button class="button primary" type="submit">
          Send Reset Instructions
        </button>

        <p id="formMessage" role="status" aria-live="polite"></p>
      </form>

      <p>
        Remember your password?
        <a class="login-link" href="/login">Return to login</a>
      </p>
    </section>
  </main>
</body>
</html>
