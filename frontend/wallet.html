<body class="community-page bga-page">

<main class="community-shell"><section class="community-welcome"><span class="eyebrow">VOLUNTEER CENTRE</span><h1>Volunteer earnings & payouts</h1><p>View programme credits, request a payout to your OPay wallet or a Nigerian bank account, and track payout status.</p><p class="status-message" id="walletMessage" role="status" aria-live="polite"></p></section>
<section class="community-panel"><h2>Available balance</h2><p id="walletBalance" style="font-size:2rem;font-weight:800">Loading…</p><p class="card-meta">Only credits approved by Baba Go Again administrators appear here. This is not a deposit or savings account.</p></section>
<section class="community-panel"><h2>Request a payout</h2><form id="payoutForm" class="stack-form"><label for="amountNaira">Amount (NGN, whole naira)</label><input id="amountNaira" type="number" min="100" max="5000000" step="1" required><label for="recipientType">Receive money by</label><select id="recipientType" required><option value="opay_wallet">OPay wallet</option><option value="bank">Nigerian bank account</option></select><label for="recipientName">Recipient's full name</label><input id="recipientName" maxlength="100" autocomplete="name" required><div id="opayFields"><label for="phoneNumber">OPay wallet phone number</label><input id="phoneNumber" inputmode="tel" autocomplete="tel" placeholder="+2348012345678"></div><div id="bankFields" hidden><label for="bankCode">Bank code (as provided by OPay)</label><input id="bankCode" maxlength="12" autocomplete="off"><label for="bankAccountNumber">10-digit bank account number</label><input id="bankAccountNumber" inputmode="numeric" maxlength="10" autocomplete="off"></div><p class="card-meta">Your destination details are encrypted before they are stored. A payout is held from your available balance while pending. Do not submit a request twice if a transfer is still processing.</p><button class="button primary" type="submit">Request payout</button></form></section>
<section class="community-panel"><h2>Payout history</h2><div id="payoutList" class="card-list"></div></section><section class="community-panel"><h2>Wallet transactions</h2><div id="transactionList" class="card-list"></div></section></main><footer><p>&copy; 2026 Baba Go Again</p></footer><script src="/wallet.js?v=20261016-wallet1" defer></script><script src="/app-nav.js?v=20261119-globalnav2" defer></script></body></html>
