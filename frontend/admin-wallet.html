<main class="community-shell"><section class="community-welcome"><span class="eyebrow">RESTRICTED ADMIN AREA</span><h1>Wallet & payout administration</h1><p>Credit verified volunteers, review payout requests and reconcile OPay transfer statuses. API access is restricted to emails configured in BGA_ADMIN_EMAILS.</p><p id="adminMessage" class="status-message" role="status" aria-live="polite"></p></section>
<section class="community-panel"><h2>Credit a volunteer wallet</h2><form id="memberSearchForm" class="stack-form"><label for="memberQuery">Find verified member by name, email or phone</label><input id="memberQuery" minlength="2" required><button class="button primary" type="submit">Search members</button></form><div id="memberResults" class="card-list"></div><form id="creditForm" class="stack-form"><input id="creditUserId" type="hidden"><p id="selectedMember">Select a member from the search results.</p><label for="creditAmount">Credit amount (NGN)</label><input id="creditAmount" type="number" min="1" step="1" required><label for="creditDescription">Reason / programme reference</label><input id="creditDescription" maxlength="200" required value="Volunteer programme reward"><button class="button primary" type="submit">Credit wallet</button></form></section>
<section class="community-panel"><h2>Pending payout requests</h2><button id="refreshPayouts" class="button secondary" type="button">Refresh queue</button><div id="payoutQueue" class="card-list"></div></section></main><footer><p>&copy; 2026 Baba Go Again</p></footer><script src="/admin-wallet.js?v=20261016-wallet1" defer></script><script src="/app-nav.js?v=20261119-globalnav4" defer></script></body></html>
