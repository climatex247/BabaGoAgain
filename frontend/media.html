<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Centre | Baba Go Again</title><link rel="stylesheet" href="/bga-features.css"><link rel="stylesheet" href="/app-nav.css?v=20261119-globalnav2"></head><body class="bga-page"><header class="bga-nav"><a class="bga-brand" href="/">Baba Go Again</a><nav class="bga-links"><a href="/community">Community</a><a href="/messages">Messages</a><a href="/public-figures">Public Figures</a><a href="/wallet">Wallet</a></nav></header><main class="bga-wrap"><h1>Audio & Video Centre</h1><p class="bga-muted">Share audio and video you own or have permission to distribute. Upload limit: 500 MB per file. MP3, WAV, OGG, M4A, MP4 and WebM formats are supported.</p><section class="bga-panel"><h2>Publish media</h2><form id="uploadForm"><label for="mediaType">Media type</label><select id="mediaType"><option value="audio">Audio</option><option value="video">Video</option></select><label for="mediaTitle">Title</label><input id="mediaTitle" maxlength="120" required><label for="mediaDescription">Description</label><textarea id="mediaDescription" maxlength="1000" rows="3"></textarea><label for="mediaFile">File (maximum 500 MB)</label><input id="mediaFile" type="file" accept="audio/*,video/mp4,video/webm" required><button type="submit">Upload and publish</button></form><p id="uploadStatus" class="bga-status" role="status"></p></section><div class="bga-row" style="margin-top:20px"><h2>Latest media</h2><select id="filterType" aria-label="Filter media"><option value="">Audio and video</option><option value="audio">Audio</option><option value="video">Video</option></select><button id="reloadMedia" type="button">Refresh</button></div><div id="mediaList" class="bga-list"></div></main><script src="/media.js" defer></script><script src="/app-nav.js?v=20261119-globalnav2" defer></script></body></html>
