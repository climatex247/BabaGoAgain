<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103d79"><title>Founder Control Centre | Baba Go Again><link rel="stylesheet" href="/bga-features.css?v=founder1"><link rel="stylesheet" href="/app-nav.css?v=founder1"><style>*{box-sizing:border-box}body{margin:0;background:#eaf2ff;color:#183653;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.founder-wrap{width:min(1160px,calc(100% - 24px));margin:22px auto 60px}.founder-hero{background:linear-gradient(120deg,#103d79,#216ab4);color:#fff;padding:26px;border-radius:20px}.founder-hero h1{margin:0 0 8px;color:#fff;font-size:clamp(1.7rem,5vw,2.5rem)}.founder-hero p{margin:0;color:#e3efff}.founder-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.founder-actions a{background:#fff;color:#103d79;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:800}.founder-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.founder-stat,.founder-panel{background:#fff;border:1px solid #d6e3f2;border-radius:15px;padding:17px;box-shadow:0 5px 18px #12345a0a}.founder-stat strong{display:block;font-size:2rem;color:#103d79}.founder-stat span{font-size:.9rem;color:#526a85}.founder-panel{margin-top:14px}.founder-panel h2{margin-top:0;color:#103d79}.founder-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.founder-links a{display:block;border:1px solid #dbe6f4;border-radius:12px;padding:14px;color:#174a91;text-decoration:none;font-weight:800;background:#f8fbff}.founder-links small{display:block;font-weight:500;color:#5b6f89;margin-top:5px}.founder-audit{border-bottom:1px solid #e5edf6;padding:10px 0}.founder-status{font-weight:700;min-height:24px;color:#174a91}@media(max-width:760px){.founder-wrap{margin:12px auto 35px}.founder-hero{padding:19px}.founder-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.founder-stat{padding:13px}.founder-stat strong{font-size:1.6rem}.founder-links{grid-template-columns:1fr}.founder-panel{padding:15px}}</style></head><body><main class="founder-wrap"><section class="founder-hero"><h1>Founder Control Centre</h1><p id="founderWelcome">Complete oversight of Baba Go Again — members, referrals, moderation and administration.</p><div class="founder-actions"><a href="/dashboard">Member Dashboard</a><a href="/admin-center">Manage Administrators</a><a href="/referrals">Founder Referral Link</a></div></section><p id="founderStatus" class="founder-status" role="status">Loading founder information…</p><section class="founder-grid"><article class="founder-stat"><strong id="members">—</strong><span>Total registered members</span></article><article class="founder-stat"><strong id="verified">—</strong><span>Active and verified</span></article><article class="founder-stat"><strong id="referrals">—</strong><span>Referral registrations</span></article><article class="founder-stat"><strong id="admins">—</strong><span>Administrators</span></article><article class="founder-stat"><strong id="media">—</strong><span>Media awaiting approval</span></article><article class="founder-stat"><strong id="profiles">—</strong><span>Public profiles awaiting review</span></article><article class="founder-stat"><strong id="reports">—</strong><span>Community reports awaiting review</span></article><article class="founder-stat"><strong id="unverified">—</strong><span>Members not yet verified</span></article></section><section class="founder-panel"><h2>Application management</h2><div class="founder-links"><a href="/admin-center">Administration Centre<small>Appoint administrators, assign roles and review audit records.</small></a><a href="/dashboard">Member activity dashboard<small>See referrals, unread messages and pending media approvals.</small></a><a href="/referrals">Referral programme<small>View your invitation link and QR code.</small></a><a href="/media">Audio & Video Centre<small>Review public media submissions from the founder dashboard.</small></a><a href="/community">Community Centre<small>Member feed, groups, events and volunteer applications.</small></a><a href="/notifications">Notifications<small>Review your account alerts.</small></a><a href="/wallet">Volunteer Wallet<small>View wallet and member payment activity.</small></a><a href="/public-figures">Public Figures<small>Public profile applications and verified figures.</small></a><a href="/messages">Messages<small>Open private member conversations.</small></a></div></section><section class="founder-panel"><h2>Recent administration activity</h2><div id="audit" aria-live="polite">Loading audit activity…</div></section></main><script src="/app-nav.js?v=founder1" defer></script><script src="/founder-dashboard.js?v=founder1" defer></script></body></html>
